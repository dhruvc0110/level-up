<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Level Up (maskable)">
  <!-- Maskable variant: same design, but glyph shrunk so the safe zone (inner 80%) is honored.
       Android adaptive icons crop the outer 20%. -->
  <defs>
    <pattern id="lvl-stripes-m" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#555555"/>
      <rect x="0" y="0" width="20" height="40" fill="#444444"/>
    </pattern>
  </defs>

  <rect width="512" height="512" fill="url(#lvl-stripes-m)"/>

  <!-- Network glyph scaled down to ~70% so it sits inside the maskable safe zone -->
  <g transform="translate(256 256) scale(0.72)" fill="#FFFFFF" stroke="#FFFFFF"
     stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none">
      <line x1="-128" y1="-90" x2="0"    y2="0"/>
      <line x1="128"  y1="-90" x2="0"    y2="0"/>
      <line x1="0"    y1="0"   x2="-105" y2="105"/>
      <line x1="0"    y1="0"   x2="105"  y2="105"/>
      <line x1="-128" y1="-90" x2="128"  y2="-90"/>
    </g>
    <circle cx="-128" cy="-90" r="26"/>
    <circle cx="128"  cy="-90" r="26"/>
    <circle cx="0"    cy="0"   r="32"/>
    <circle cx="-105" cy="105" r="26"/>
    <circle cx="105"  cy="105" r="26"/>
  </g>
</svg>
