<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Level Up">
  <!-- Medium grey base with clearly visible diagonal stripes + white network glyph -->
  <defs>
    <pattern id="lvl-stripes" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#555555"/>
      <rect x="0" y="0" width="20" height="40" fill="#444444"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#lvl-stripes)"/>

  <!-- Subtle inner border to give the icon a little definition -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>

  <!-- Network glyph, centered. Five nodes (pentagon-ish), white. -->
  <g transform="translate(256 256)" fill="#FFFFFF" stroke="#FFFFFF"
     stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Edges first (under the nodes) -->
    <g fill="none">
      <line x1="-128" y1="-90" x2="0"    y2="0"/>
      <line x1="128"  y1="-90" x2="0"    y2="0"/>
      <line x1="0"    y1="0"   x2="-105" y2="105"/>
      <line x1="0"    y1="0"   x2="105"  y2="105"/>
      <line x1="-128" y1="-90" x2="128"  y2="-90"/>
    </g>
    <!-- Nodes -->
    <circle cx="-128" cy="-90" r="26"/>
    <circle cx="128"  cy="-90" r="26"/>
    <circle cx="0"    cy="0"   r="32"/>
    <circle cx="-105" cy="105" r="26"/>
    <circle cx="105"  cy="105" r="26"/>
  </g>
</svg>
