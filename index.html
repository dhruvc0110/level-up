<script>
  // Apply the saved theme before anything paints (no dark flash in Light/Neutral).
  try { var luT = localStorage.getItem('lu_theme'); if (luT === 'light' || luT === 'neutral') document.documentElement.setAttribute('data-theme', luT); } catch (e) { /* storage blocked */ }
</script>

<style>
  :root {
    /* Quiet luxury palette — almost-black field, hairline chrome */
    --bg-0:        #070707;   /* deepest field */
    --bg-1:        #0C0C0C;   /* base */
    --bg-2:        #121212;   /* card */
    --bg-3:        #181818;   /* hover / elevated */
    --bg-4:        #1F1F1F;   /* active */

    --line-1:      rgba(255,255,255,0.05);  /* hairline */
    --line-2:      rgba(255,255,255,0.08);  /* divider */
    --line-3:      rgba(255,255,255,0.14);  /* focus */

    --ink-1:       #ECEAE6;   /* primary text */
    --ink-2:       #A6A39C;   /* secondary */
    --ink-3:       #6E6B65;   /* tertiary */
    --ink-4:       #46443F;   /* quaternary / quiet labels */
    --ink-hover:   #FFFFFF;   /* primary button hover */
    --scroll:      rgba(255,255,255,0.08);
    --scroll-hover: rgba(255,255,255,0.16);
    --selection:   rgba(236,234,230,0.16);

    /* Five quiet stage colors — desaturated, all live around oklch L≈74% */
    --st-discovered:    oklch(74% 0.018 250);   /* cool slate */
    --st-evaluating:    oklch(74% 0.030 290);   /* violet dust */
    --st-applied:       oklch(74% 0.035 170);   /* jade dust */
    --st-conversations: oklch(76% 0.055 80);    /* wheat / warm gold */
    --st-decision:      oklch(74% 0.060 25);    /* dusky rose */

    /* Signal red — reserved exclusively for overdue */
    --signal:      oklch(64% 0.16 25);

    /* Type stack */
    --serif: 'Newsreader', ui-serif, Georgia, serif;
    --sans:  'Geist', ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono:  'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    /* Density */
    --row-h: 36px;
    --card-pad: 14px;
    --kan-gap: 10px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-0);
    color: var(--ink-1);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  body { font-feature-settings: "ss01", "cv11"; }

  /* Scrollbars: invisible by default, hairline on hover */
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; transition: background .2s; }
  *:hover::-webkit-scrollbar-thumb { background: var(--scroll); }
  *::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }

  ::selection { background: var(--selection); color: var(--ink-1); }

  /* Type primitives */
  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.005em; }
  .serif-italic { font-family: var(--serif); font-style: italic; font-weight: 400; }
  .mono { font-family: var(--mono); font-feature-settings: "ss01", "ss02"; }

  .eyebrow {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 500;
  }

  /* Button reset */
  button { font-family: inherit; cursor: pointer; }

  /* Focus rings — minimal */
  :focus-visible { outline: 1px solid var(--line-3); outline-offset: 1px; border-radius: 2px; }

  /* Root */
  #root { height: 100%; }

  /* Master layout */
  .lu-shell {
    display: grid;
    grid-template-columns: 232px 1fr;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    background: var(--bg-0);
  }

  /* When a slide-over is open we let it overlay; main keeps width */
  .lu-main {
    display: flex; flex-direction: column;
    min-width: 0;
    height: 100vh;
    overflow: hidden;
  }
  .lu-main-scroll {
    flex: 1;
    overflow: auto;
    min-height: 0;
  }

  /* Hairline utility */
  .hl-r { border-right: 1px solid var(--line-1); }
  .hl-b { border-bottom: 1px solid var(--line-1); }
  .hl-l { border-left: 1px solid var(--line-1); }
  .hl-t { border-top: 1px solid var(--line-1); }

  /* Pin-stripe hover */
  .row-hover { transition: background .15s; }
  .row-hover:hover { background: var(--bg-2); }

  /* Kbd / chip */
  .kbd {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
    background: var(--bg-2); border: 1px solid var(--line-1);
    padding: 1px 5px; border-radius: 3px; line-height: 1.3;
  }

  /* ════════════════════════════════════════════════════════════════════
     AESTHETIC DIRECTIONS — body[data-aesthetic] drives meaningful shifts.
     Each direction is a distinct identity within the dark/executive brief.
     ════════════════════════════════════════════════════════════════════ */

  /* — QUIET LUXURY (default) — warm near-black, hairline chrome, serif italic */
  body[data-aesthetic="quiet"] {
    --bg-0: #070707; --bg-1: #0C0C0C; --bg-2: #121212; --bg-3: #181818; --bg-4: #1F1F1F;
    --line-1: rgba(255,255,255,0.05); --line-2: rgba(255,255,255,0.08); --line-3: rgba(255,255,255,0.14);
    --ink-1: #ECEAE6; --ink-2: #A6A39C; --ink-3: #6E6B65; --ink-4: #46443F;
  }

  /* — EDITORIAL WAR ROOM — cooler ink, sharper structure, italic accents, thicker rules */
  body[data-aesthetic="editorial"] {
    --bg-0: #0A0A0C; --bg-1: #101013; --bg-2: #16161A; --bg-3: #1D1D22; --bg-4: #25252C;
    --line-1: rgba(255,255,255,0.10); --line-2: rgba(255,255,255,0.16); --line-3: rgba(255,255,255,0.24);
    --ink-1: #F4F2EE; --ink-2: #B6B2AA; --ink-3: #7A766F; --ink-4: #4E4C46;
  }
  body[data-aesthetic="editorial"] .serif {
    letter-spacing: -0.028em !important;
    font-weight: 400 !important;
  }
  body[data-aesthetic="editorial"] h1.serif,
  body[data-aesthetic="editorial"] h2.serif {
    font-style: italic !important;
    font-family: var(--serif) !important;
  }
  body[data-aesthetic="editorial"] h1.serif::first-letter,
  body[data-aesthetic="editorial"] h2.serif::first-letter {
    font-style: italic;
  }
  body[data-aesthetic="editorial"] .eyebrow {
    color: var(--ink-2);
    letter-spacing: 0.18em;
  }

  /* — BLOOMBERG TERMINAL — pure black, amber chrome, all-mono headers, dense */
  body[data-aesthetic="bloomberg"] {
    --bg-0: #000000; --bg-1: #050505; --bg-2: #0B0B08; --bg-3: #131008; --bg-4: #1C160A;
    --line-1: rgba(255,176,40,0.12); --line-2: rgba(255,176,40,0.20); --line-3: rgba(255,176,40,0.34);
    --ink-1: #FFB930; --ink-2: #C68A1F; --ink-3: #855C13; --ink-4: #4D360C;
    --signal: #F44A2A;
    --st-discovered:    #6FA9C8;
    --st-evaluating:    #C16CC4;
    --st-applied:       #5BBD81;
    --st-conversations: #E8A93E;
    --st-decision:      #F2E1B3;
  }
  body[data-aesthetic="bloomberg"] *,
  body[data-aesthetic="bloomberg"] {
    font-feature-settings: "tnum", "ss01";
  }
  body[data-aesthetic="bloomberg"] .serif,
  body[data-aesthetic="bloomberg"] .serif-italic {
    font-family: var(--mono) !important;
    font-style: normal !important;
    letter-spacing: 0.02em !important;
    font-weight: 400 !important;
  }
  body[data-aesthetic="bloomberg"] h1.serif,
  body[data-aesthetic="bloomberg"] h2.serif,
  body[data-aesthetic="bloomberg"] h3.serif {
    text-transform: uppercase;
    letter-spacing: 0.06em !important;
    font-weight: 500 !important;
  }
  body[data-aesthetic="bloomberg"] ::selection { background: rgba(255,185,48,0.25); }

  /* — LINEAR / PITCH — cooler ink, sans-dominated, rounded edges, higher contrast */
  body[data-aesthetic="linear"] {
    --bg-0: #08090C; --bg-1: #0E1015; --bg-2: #14161D; --bg-3: #1B1E27; --bg-4: #232631;
    --line-1: rgba(170,180,210,0.07); --line-2: rgba(170,180,210,0.12); --line-3: rgba(140,160,220,0.34);
    --ink-1: #F5F6FA; --ink-2: #A8ACB8; --ink-3: #6D7080; --ink-4: #44475A;
  }
  body[data-aesthetic="linear"] .serif {
    font-family: var(--sans) !important;
    font-weight: 500 !important;
    letter-spacing: -0.022em !important;
  }
  body[data-aesthetic="linear"] .serif-italic {
    font-family: var(--sans) !important;
    font-style: normal !important;
    font-weight: 400 !important;
    color: var(--ink-3) !important;
    letter-spacing: -0.012em !important;
  }
  body[data-aesthetic="linear"] h1.serif { font-weight: 600 !important; }

  /* Density */
  body[data-density="compact"] { --row-h: 28px; --card-pad: 10px; --kan-gap: 6px; }
  body[data-density="regular"] { --row-h: 36px; --card-pad: 14px; --kan-gap: 10px; }
  body[data-density="comfy"]   { --row-h: 44px; --card-pad: 18px; --kan-gap: 14px; }

  /* ─────────────────────────────────────────────────────────────────
     THEMES — Settings → Appearance. Dark is the base palette above.
     html[data-theme] … body beats body[data-aesthetic] so the theme wins.
     ───────────────────────────────────────────────────────────────── */
  html[data-theme="light"] { color-scheme: light; background: #F3F2EF; }
  html[data-theme="light"] body {
    --bg-0: #F3F2EF; --bg-1: #F8F7F5; --bg-2: #FFFFFF; --bg-3: #EEECE8; --bg-4: #E5E2DD;
    --line-1: rgba(24,22,18,0.08); --line-2: rgba(24,22,18,0.13); --line-3: rgba(24,22,18,0.24);
    --ink-1: #1A1916; --ink-2: #4F4C46; --ink-3: #807C75; --ink-4: #ABA79F;
    --ink-hover: #000000;
    --st-discovered:    oklch(55% 0.04 250);
    --st-evaluating:    oklch(52% 0.07 290);
    --st-applied:       oklch(52% 0.07 170);
    --st-conversations: oklch(58% 0.10 75);
    --st-decision:      oklch(52% 0.11 25);
    --signal: oklch(52% 0.18 25);
    --scroll: rgba(24,22,18,0.12); --scroll-hover: rgba(24,22,18,0.24);
    --selection: rgba(24,22,18,0.12);
  }
  html[data-theme="neutral"] { color-scheme: light; background: #E3DED5; }
  html[data-theme="neutral"] body {
    --bg-0: #E3DED5; --bg-1: #E9E5DD; --bg-2: #F2EFE9; --bg-3: #DDD7CC; --bg-4: #D3CCBF;
    --line-1: rgba(60,46,28,0.10); --line-2: rgba(60,46,28,0.16); --line-3: rgba(60,46,28,0.28);
    --ink-1: #29241E; --ink-2: #5A5247; --ink-3: #857C6F; --ink-4: #ADA493;
    --ink-hover: #000000;
    --st-discovered:    oklch(52% 0.04 240);
    --st-evaluating:    oklch(50% 0.06 300);
    --st-applied:       oklch(50% 0.06 160);
    --st-conversations: oklch(56% 0.10 70);
    --st-decision:      oklch(50% 0.10 30);
    --signal: oklch(50% 0.17 30);
    --scroll: rgba(60,46,28,0.14); --scroll-hover: rgba(60,46,28,0.26);
    --selection: rgba(60,46,28,0.14);
  }
</style>

<script>
  // Register the service worker. Failures are non-fatal — the app still
  // works fine without it; SW just enables installability + offline cache.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch((err) => {
        console.warn('[Level Up] SW registration failed:', err);
      });
    });
  }
